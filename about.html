<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us - H2 Tech</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 800px; margin: 0 auto; }

        /* Navigation Bar */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-btn, .lang-btn {
            background: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-decoration: none;
            color: #333;
        }

        .lang-btn.active {
            background: #2c3e50;
            color: white;
        }

        /* Content Card */
        .content-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            line-height: 1.6;
        }

        h1 { 
            color: #2c3e50; 
            margin-bottom: 20px; 
            border-bottom: 2px solid #667eea; 
            padding-bottom: 10px; 
        }

        h2 { color: #764ba2; margin-top: 25px; margin-bottom: 10px; }
        p { margin-bottom: 15px; font-size: 1.1rem; color: #555; }
        .footer { text-align: center; color: white; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <a href="index.html" class="back-btn" data-en="← Back to Home" data-ar="← العودة للرئيسية">← Back to Home</a>
            <div class="language-switcher">
                <button class="lang-btn active" onclick="switchLanguage('en')">EN</button>
                <button class="lang-btn" onclick="switchLanguage('ar')">AR</button>
            </div>
        </div>
        
        <div class="content-card">
            <h1 data-en="About H2 Tech" data-ar="حول H2 تك">About H2 Tech</h1>
            
            <p data-en="Welcome to H2 Tech, your premier destination for high-quality electronics in Morocco. Founded by H&H, our mission is to provide the latest technology." 
               data-ar="مرحباً بكم في H2 تك، وجهتكم الأولى للإلكترونيات عالية الجودة في المغرب. تأسست بواسطة H&H، ومهمتنا هي تقديم أحدث التقنيات.">
               Welcome to H2 Tech, your premier destination for high-quality electronics in Morocco. Founded by H&H, our mission is to provide the latest technology.
            </p>

            <h2 data-en="Our Vision" data-ar="رؤيتنا">Our Vision</h2>
            <p data-en="We believe that premium tech should be accessible to everyone."
               data-ar="نحن نؤمن بأن التقنية المميزة يجب أن تكون في متناول الجميع.">
               We believe that premium tech should be accessible to everyone.
            </p>
        </div>

        <footer class="footer">
            <p data-en="© 2024 H2 Tech" data-ar="© 2024 H2 تك">© 2024 H2 Tech</p>
        </footer>
    </div>

    <script>
        function switchLanguage(lang) {
            document.body.style.direction = (lang === 'ar') ? 'rtl' : 'ltr';
            document.querySelectorAll('[data-en], [data-ar]').forEach(el => {
                const text = el.getAttribute('data-' + lang);
                if (text) el.textContent = text;
            });
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.toLowerCase().includes(lang)) {
                    btn.classList.add('active');
                }
            });
        }
    </script>
</body>
</html>
