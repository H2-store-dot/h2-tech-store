<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Watch Pro - H2 Tech</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
            transition: direction 0.3s ease;
        }

        .container { max-width: 800px; margin: 0 auto; }

        /* Navigation Bar */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-btn, .lang-btn {
            background: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            color: #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .lang-btn.active {
            background: #2c3e50;
            color: white;
        }

        /* Product Detail Card */
        .product-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .watch-emoji { 
            font-size: 6rem; 
            margin: 20px 0;
            display: block;
        }

        h1 { color: #2c3e50; margin-bottom: 15px; }
        
        .description { 
            color: #666; 
            font-size: 1.1rem; 
            line-height: 1.6; 
            margin-bottom: 20px;
        }

        .price { 
            font-size: 2.5rem; 
            color: #764ba2; 
            font-weight: bold; 
            margin: 20px 0; 
        }

        .whatsapp-btn {
            background: #25D366;
            color: white;
            padding: 15px 35px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            display: inline-block;
            font-size: 1.2rem;
            transition: transform 0.2s;
        }

        .whatsapp-btn:hover { transform: scale(1.05); }

        @media (max-width: 600px) {
            .product-card { padding: 25px; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <a href="index.html" class="back-btn" data-en="← Back" data-ar="← رجوع">← Back</a>
            <div>
                <button class="lang-btn" id="btn-en" onclick="switchLanguage('en')">EN</button>
                <button class="lang-btn" id="btn-ar" onclick="switchLanguage('ar')">AR</button>
            </div>
        </div>
        
        <div class="product-card">
            <h1 data-en="Smart Watch Pro" data-ar="ساعة ذكية برو">Smart Watch Pro</h1>
            <div class="watch-emoji">⌚</div>
            <p class="description" data-en="High-quality display with long battery life, fitness tracking, and water resistance. Perfect for a modern lifestyle." 
               data-ar="شاشة عالية الجودة مع عمر بطارية طويل، وتتبع اللياقة البدنية، ومقاومة الماء. مثالية لنمط الحياة العصري.">
               High-quality display with long battery life, fitness tracking, and water resistance. Perfect for a modern lifestyle.
            </p>
            <div class="price">499 MAD</div>
            <a href="https://wa.me/212689622405?text=I%20want%20to%20order%20the%20Smart%20Watch%20Pro" class="whatsapp-btn" data-en="Order on WhatsApp" data-ar="اطلب عبر واتساب">
                Order on WhatsApp
            </a>
        </div>
    </div>

    <script>
        // Apply the language to all elements
        function applyLanguage(lang) {
            // Change page direction (Right-to-Left for Arabic)
            document.body.style.direction = (lang === 'ar') ? 'rtl' : 'ltr';

            // Update text content for all elements with data-en/data-ar
            document.querySelectorAll('[data-en], [data-ar]').forEach(el => {
                const text = el.getAttribute('data-' + lang);
                if (text) el.textContent = text;
            });

            // Update button visual state
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            const activeBtn = document.getElementById('btn-' + lang);
            if (activeBtn) activeBtn.classList.add('active');
        }

        // Save choice and apply it
        function switchLanguage(lang) {
            localStorage.setItem('preferredLang', lang); 
            applyLanguage(lang);
        }

        // Check memory automatically when page opens
        window.onload = function() {
            const savedLang = localStorage.getItem('preferredLang') || 'en';
            applyLanguage(savedLang);
        };
    </script>
</body>
</html>
