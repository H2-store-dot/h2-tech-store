<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartwatches - H2 Tech</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .back-btn, .lang-btn {
            background: white; border: none; padding: 10px 20px; border-radius: 25px;
            cursor: pointer; font-weight: bold; text-decoration: none; color: #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .lang-btn.active { background: #2c3e50; color: white; }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: white; padding: 25px; border-radius: 15px; 
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .watch-icon { font-size: 4rem; margin-bottom: 15px; }
        .product-title { color: #2c3e50; font-size: 1.4rem; margin-bottom: 20px; font-weight: bold; }
        .view-details-btn { 
            background: #764ba2; color: white; padding: 12px 25px; 
            text-decoration: none; border-radius: 25px; font-weight: bold; display: inline-block; 
        }
        .upcoming-card {
            background: rgba(255, 255, 255, 0.7);
            border: 2px dashed #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <a href="index.html" class="back-btn" data-en="← Back to Home" data-ar="← العودة للرئيسية">← Back to Home</a>
            <div>
                <button class="lang-btn" id="btn-en" onclick="switchLanguage('en')">EN</button>
                <button class="lang-btn" id="btn-ar" onclick="switchLanguage('ar')">AR</button>
            </div>
        </div>
        
        <div class="products-grid">
            <div class="product-card">
                <div class="watch-icon">⌚</div>
                <h3 class="product-title" data-en="Apple Watch" data-ar="ساعة آبل">Apple Watch</h3>
                <a href="apple-watch.html" class="view-details-btn" data-en="View Details" data-ar="عرض التفاصيل">View Details</a>
            </div>

            <div class="product-card">
                <div class="watch-icon">⌚</div>
                <h3 class="product-title" data-en="C90 Max Ultra" data-ar="ساعة C90 ماكس الترا">C90 Max Ultra</h3>
                <a href="c90-max-ultra.html" class="view-details-btn" data-en="View Details" data-ar="عرض التفاصيل">View Details</a>
            </div>

            <div class="product-card">
                <div class="watch-icon">⌚</div>
                <h3 class="product-title" data-en="Samsung Watch" data-ar="ساعة سامسونج">Samsung Watch</h3>
                <a href="samsung.html" class="view-details-btn" data-en="View Details" data-ar="عرض التفاصيل">View Details</a>
            </div>

            <div class="product-card upcoming-card">
                <div class="watch-icon" style="opacity: 0.5;">⌚</div>
                <h3 class="product-title" data-en="Coming Soon" data-ar="قريباً">Coming Soon</h3>
                <a href="#" class="view-details-btn" style="background: #ccc;" data-en="Stay Tuned" data-ar="انتظرونا">Stay Tuned</a>
            </div>
        </div>
    </div>

    <script>
        function applyLanguage(lang) {
            document.body.style.direction = (lang === 'ar') ? 'rtl' : 'ltr';
            document.querySelectorAll('[data-en], [data-ar]').forEach(el => {
                const text = el.getAttribute('data-' + lang);
                if (text) el.textContent = text;
            });
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.id === 'btn-' + lang) btn.classList.add('active');
            });
        }

        function switchLanguage(lang) {
            localStorage.setItem('preferredLang', lang);
            applyLanguage(lang);
        }

        window.onload = function() {
            const savedLang = localStorage.getItem('preferredLang') || 'en';
            applyLanguage(savedLang);
        };
    </script>
</body>
</html>
